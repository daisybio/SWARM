<div *ngIf="groupings.length >= 2" class="dma-group-by">
  <mat-form-field appearance="fill">
    <mat-label>Group by</mat-label>
    <mat-select [(value)]="selectedGrouping">
      <mat-option *ngFor="let g of groupings" [value]="g.col">{{ g.label }}</mat-option>
    </mat-select>
  </mat-form-field>
</div>

<ng-container *ngIf="currentGrouping as grouping">
  <p *ngIf="grouping.col" class="dma-grouping-note"><strong>Grouping:</strong> {{ grouping.label }}</p>

  <div *ngFor="let c of grouping.comparisons">
    <h4>{{ c.title }}</h4>

    <app-table [data]="c.table" [actionColumns]="[]" [showIndexColumn]="false"></app-table>

    <br />
  </div>
</ng-container>
